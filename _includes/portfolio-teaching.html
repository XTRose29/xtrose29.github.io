<article class="teaching-card">
  <div class="teaching-date"><time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.semester }}</time><span class="timeline-dot" aria-hidden="true"></span></div>
  <div class="teaching-body"><div class="teaching-card-meta">{% include institution-logo.html key="cornell" %}<span class="role-label">{{ post.type }}</span></div><h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>{% include flow-graph.html steps=post.visual_steps label=post.title %}{% if post.note %}<p>{{ post.note }}</p>{% endif %}</div>
</article>
