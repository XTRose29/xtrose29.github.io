{% if jekyll.environment == "production" and page.permalink != "/visitors/" %}
<!-- Only request the tracking pixel when this browser is not excluded. -->
<script>
if (!window.excludeOwnVisits) {
  var visitorPixel = new Image(1, 1);
  visitorPixel.alt = '';
  visitorPixel.setAttribute('aria-hidden', 'true');
  visitorPixel.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;pointer-events:none';
  visitorPixel.src = 'https://mapmyvisitors.com/map.png?d=mxqCzafcvAvqrtluVRfzqD076NRiKe5PoD7RQX_Z7Rw&cl=ffffff';
  document.body.appendChild(visitorPixel);
}
</script>
{% endif %}
